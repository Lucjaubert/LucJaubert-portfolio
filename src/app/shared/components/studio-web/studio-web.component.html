<section
  *ngIf="sections.length > 0"
  id="studio-web"
  class="studio-web-presentation py-md-5 py-5"
>
  <!-- Contenu visuel / animé (inchangé) -->
  <div class="row studio-web-section" aria-hidden="true">
    <div class="studio-web-list">
      <div class="current-sections">
        <div
          *ngFor="let section of sections; let i = index"
          [attr.id]="section.name | slugify"
          [ngClass]="getSectionClass(i)"
          #studioSectionContainer
        >
          <div class="section-container col-md-8 col-12 px-5 py-4 d-flex flex-column justify-content-top align-items-start mask-wrapper">
            <h3 class="text-slide mb-0">{{ section.name }}</h3>
            <div class="horizontal-line mt-3"></div>
            <p class="mission-slide mt-md-5 mt-3 pe-md-15" [innerHTML]="section.mission | lineBreaks"></p>

            <div *ngIf="section.whenRelevant && section.whenRelevant.length > 0"
                 class="when-relevant-block mt-md-5 mt-4 pe-md-15">
              <h4 class="text-fs-40 text-orange mb-3">Quand cela devient pertinent</h4>
              <ul class="when-relevant-list">
                <li *ngFor="let item of section.whenRelevant"
                    class="text-fs-20 mb-2"
                    [innerHTML]="item | lineBreaks"></li>
              </ul>
            </div>

            <div *ngIf="section.typicalExample"
                 class="typical-example-block mt-md-4 mt-3 pe-md-15">
              <h4 class="text-fs-40 text-orange mb-3">Exemple d'usage typique</h4>
              <p class="text-fs-20 typical-example-text fst-italic"
                 [innerHTML]="section.typicalExample | lineBreaks"></p>
            </div>
          </div>

          <div class="vertical-line d-none d-md-block"></div>

          <div class="section-details-preview col-md-4 col-12 px-5 pt-2 d-flex justify-content-start align-items-top mask-wrapper">
            <div class="stacks-slide d-flex flex-column align-items-start px-md-2 py-md-5">
              <span
                *ngFor="let stack of section.stacks.split(',')"
                class="mt-1 text-start stack-item"
              >
                {{ stack.trim() }}
              </span>
            </div>
          </div>

          <div class="visually-hidden">
            <h3>{{ section.name }}</h3>
            <p [innerHTML]="section.mission | lineBreaks"></p>
            <p>
              Technologies : {{ section.stacks }}
            </p>
            <div *ngIf="section.whenRelevant && section.whenRelevant.length > 0">
              <h4>Quand cela devient pertinent</h4>
              <ul>
                <li *ngFor="let item of section.whenRelevant"
                    [innerHTML]="item | lineBreaks"></li>
              </ul>
            </div>
            <div *ngIf="section.typicalExample">
              <h4>Exemple d'usage typique</h4>
              <p [innerHTML]="section.typicalExample | lineBreaks"></p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
