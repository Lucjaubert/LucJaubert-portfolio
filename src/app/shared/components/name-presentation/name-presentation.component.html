<section class="name-presentation mt-20-xl mt-25-lg mt-27-md mt-35-sm mt-30-xs">
  <!-- SEO/A11Y : seul H1 de la page, invisible visuellement, lisible par lecteurs d'écran -->
  <h1 class="visually-hidden">
    LJ Studio Web – Luc Jaubert, développeur web freelance à Bordeaux
  </h1>

  <p class="visually-hidden">
    Création de sites internet sur-mesure : site vitrine, e-commerce, WordPress headless, Angular, performance et optimisation SEO à Bordeaux.
  </p>

  <!-- Contenu visuel (les anciens h1 sont devenus des spans pour éviter le multi-H1 SEO) -->
  <div class="row">
    <div class="px-0 text-left">
      <div class="first-name ml11">
        <span class="text-wrapper d-flex align-items-baseline">
          <img [src]="'assets/img/icons/' + currentColor.image" alt="Logo Luc Jaubert — LJ Studio Web" class="logo-letter">
          <span class="name-display" [style.color]="currentColor.hex">
            <span class="first-line line1" [style.backgroundColor]="currentColor.hex"></span>
            <span class="letters-1">uc</span>
          </span>
        </span>
      </div>

      <div class="ml11">
        <span class="text-wrapper d-flex align-items-baseline">
          <span class="name-display last-name">
            <span [style.color]="currentColor.hex">J</span>
          </span>
          <span class="name-display" [style.color]="currentColor.hex">
            <span class="second-line line1" [style.backgroundColor]="currentColor.hex"></span>
            <span class="letters-2">aubert</span>
          </span>
          <span class="name-display">
            <span class="dot">.</span>
          </span>
        </span>
      </div>

      <h2 class="ml13 py-md-1 py-3" [style.color]="currentColor.hex">
        <span class="letters-3">D</span><span class="letters-3">e</span><span class="letters-3">v</span><span class="letters-3">e</span><span class="letters-3">l</span><span class="letters-3">o</span><span class="letters-3">p</span><span class="letters-3">p</span><span class="letters-3">e</span><span class="letters-3">u</span><span class="letters-3">r</span>
        <span class="space"> </span>
        <span class="letters-3">W</span><span class="letters-3">e</span><span class="letters-3">b</span>
        <span class="space"> </span>
        <span class="letters-3">F</span><span class="letters-3">r</span><span class="letters-3">e</span><span class="letters-3">e</span><span class="letters-3">l</span><span class="letters-3">a</span><span class="letters-3">n</span><span class="letters-3">c</span><span class="letters-3">e</span>
      </h2>
    </div>
  </div>
</section>
